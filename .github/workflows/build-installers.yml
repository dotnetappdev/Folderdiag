name: Build installers

# Builds FolderDiag (WPF) and produces, per architecture:
#   - FolderDiag-<ver>-<arch>-portable.exe   single-file self-contained exe
#   - FolderDiag-Setup-<ver>-<arch>.exe       Inno Setup installer
#   - FolderDiag-<ver>-<arch>.msix            MSIX package (signed)
# Pushing a tag like v1.2.3 also publishes a GitHub Release with all files.
#
# MSIX signing (optional, recommended for real releases):
#   secrets.MSIX_CERTIFICATE           base64-encoded .pfx
#   secrets.MSIX_CERTIFICATE_PASSWORD  password for that .pfx
#   vars.MSIX_PUBLISHER                must exactly match the cert subject, e.g. "CN=dotnetappdev"
# Without these a self-signed certificate is generated and its .cer is shipped
# alongside the .msix (import it into "Trusted People" to install).

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: create a GitHub Release with this tag (e.g. v0.1.0-test1). Hyphenated tags become pre-releases.'
        required: false
        default: ''

# Least privilege: build jobs can only read. Only the release job gets write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: src/FolderDiag.Wpf/FolderDiag.Wpf.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, arm64 ]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.release_tag }}'
          if (-not $tag -and $env:GITHUB_REF -like 'refs/tags/v*') { $tag = $env:GITHUB_REF_NAME }
          if ($tag) {
            if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag '$tag' must look like v1.2.3 or v1.2.3-test1" }
            $v = $tag.TrimStart('v') -replace '-.*$',''
          } else {
            $v = "1.0.$env:GITHUB_RUN_NUMBER"
          }
          "version=$v"      >> $env:GITHUB_OUTPUT
          "msixVersion=$v.0" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Publish (self-contained folder)
        shell: pwsh
        run: >
          dotnet publish $env:PROJECT -c Release -r win-${{ matrix.arch }}
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o artifacts/publish/${{ matrix.arch }}

      - name: Publish (portable single-file exe)
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT -c Release -r win-${{ matrix.arch }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o artifacts/portable/${{ matrix.arch }}
          New-Item -ItemType Directory -Force artifacts/out | Out-Null
          Copy-Item artifacts/portable/${{ matrix.arch }}/FolderDiag.Wpf.exe `
            "artifacts/out/FolderDiag-${{ steps.ver.outputs.version }}-${{ matrix.arch }}-portable.exe"

      # ── Inno Setup ───────────────────────────────────────────────────────
      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          & $env:ISCC `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "/DArch=${{ matrix.arch }}" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\artifacts\publish\${{ matrix.arch }}" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\artifacts\out" `
            installer\FolderDiag.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      # ── MSIX ─────────────────────────────────────────────────────────────
      - name: Locate Windows SDK tools
        shell: pwsh
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $bin = Get-ChildItem $kits -Directory |
                   Where-Object { $_.Name -match '^\d+\.' -and (Test-Path "$($_.FullName)\x64\makeappx.exe") } |
                   Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $bin) { throw "Windows SDK makeappx.exe not found" }
          "MAKEAPPX=$($bin.FullName)\x64\makeappx.exe" >> $env:GITHUB_ENV
          "SIGNTOOL=$($bin.FullName)\x64\signtool.exe" >> $env:GITHUB_ENV

      - name: Stage MSIX layout
        shell: powershell   # Windows PowerShell for System.Drawing
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          $stage = "artifacts\msix\${{ matrix.arch }}"
          New-Item -ItemType Directory -Force "$stage\Assets" | Out-Null
          Copy-Item -Recurse -Force "artifacts\publish\${{ matrix.arch }}\*" $stage

          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { 'CN=FolderDiag' }
          "MSIX_PUBLISHER_RESOLVED=$publisher" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

          (Get-Content installer\msix\AppxManifest.xml -Raw) `
            -replace '\$VERSION\$',   '${{ steps.ver.outputs.msixVersion }}' `
            -replace '\$ARCH\$',      '${{ matrix.arch }}' `
            -replace '\$PUBLISHER\$', [Security.SecurityElement]::Escape($publisher) |
            Set-Content -Encoding UTF8 "$stage\AppxManifest.xml"

          # Generate simple placeholder logos (replace with real art in installer\msix\Assets if present)
          Add-Type -AssemblyName System.Drawing
          function New-Logo($path, $w, $h) {
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode = 'AntiAlias'; $g.TextRenderingHint = 'AntiAliasGridFit'
            $g.Clear([System.Drawing.Color]::FromArgb(255, 0, 103, 192))
            $size = [Math]::Max(8, [Math]::Min($w, $h) * 0.45)
            $font = New-Object System.Drawing.Font 'Segoe UI', $size, ([System.Drawing.FontStyle]::Bold), ([System.Drawing.GraphicsUnit]::Pixel)
            $fmt = New-Object System.Drawing.StringFormat
            $fmt.Alignment = 'Center'; $fmt.LineAlignment = 'Center'
            $g.DrawString('FD', $font, [System.Drawing.Brushes]::White, (New-Object System.Drawing.RectangleF 0, 0, $w, $h), $fmt)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          New-Logo "$stage\Assets\StoreLogo.png"         50  50
          New-Logo "$stage\Assets\Square44x44Logo.png"   44  44
          New-Logo "$stage\Assets\Square150x150Logo.png" 150 150
          New-Logo "$stage\Assets\Wide310x150Logo.png"   310 150
          if (Test-Path installer\msix\Assets) {
            Copy-Item -Force installer\msix\Assets\* "$stage\Assets\"
          }

      - name: Pack MSIX
        shell: pwsh
        run: |
          $out = "artifacts\out\FolderDiag-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.msix"
          & $env:MAKEAPPX pack /d "artifacts\msix\${{ matrix.arch }}" /p $out /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed ($LASTEXITCODE)" }
          "MSIX_FILE=$out" >> $env:GITHUB_ENV

      - name: Sign MSIX
        shell: pwsh
        env:
          # The real signing certificate is never exposed to pull_request builds.
          CERT_B64: ${{ github.event_name != 'pull_request' && secrets.MSIX_CERTIFICATE || '' }}
          CERT_PWD: ${{ github.event_name != 'pull_request' && secrets.MSIX_CERTIFICATE_PASSWORD || '' }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "msix-$([guid]::NewGuid()).pfx"
          try {
          if ($env:CERT_B64) {
            if (-not $env:CERT_PWD) { throw "MSIX_CERTIFICATE is set but MSIX_CERTIFICATE_PASSWORD is missing" }
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64.Trim()))
            $certPwd = $env:CERT_PWD
            Write-Host "::add-mask::$certPwd"
            & $env:SIGNTOOL sign /fd SHA256 /f $pfx /p $certPwd /tr http://timestamp.digicert.com /td SHA256 $env:MSIX_FILE
          } else {
            Write-Host "No signing secret set - using a self-signed certificate for $env:MSIX_PUBLISHER_RESOLVED"
            $cert = New-SelfSignedCertificate -Type Custom `
              -Subject $env:MSIX_PUBLISHER_RESOLVED `
              -KeyUsage DigitalSignature `
              -FriendlyName 'FolderDiag test signing' `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
            $certPwd = [guid]::NewGuid().ToString()
            Write-Host "::add-mask::$certPwd"
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $certPwd -AsPlainText -Force) | Out-Null
            Export-Certificate -Cert $cert -FilePath "artifacts\out\FolderDiag-${{ matrix.arch }}-selfsigned.cer" | Out-Null
            & $env:SIGNTOOL sign /fd SHA256 /f $pfx /p $certPwd $env:MSIX_FILE
          }
          if ($LASTEXITCODE -ne 0) { throw "signtool failed ($LASTEXITCODE)" }
          } finally {
            # Never leave key material on the runner
            if (Test-Path $pfx) { Remove-Item $pfx -Force }
            Get-ChildItem Cert:\CurrentUser\My | Where-Object FriendlyName -eq 'FolderDiag test signing' | Remove-Item -Force -ErrorAction SilentlyContinue
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FolderDiag-${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          path: artifacts/out/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # On manual runs the tag is created at the commit that was built
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          # Tags like v1.2.3-test / v1.2.3-beta are published as pre-releases
          prerelease: ${{ contains(github.event.inputs.release_tag || github.ref_name, '-') }}
