<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Mode Background -->
  <rect width="1280" height="720" fill="#1E1E1E"/>
  
  <!-- Window Border -->
  <rect x="10" y="10" width="1260" height="700" fill="none" stroke="#3C3C3C" stroke-width="2"/>
  
  <!-- Title Bar -->
  <rect x="10" y="10" width="1260" height="40" fill="#2D2D30"/>
  <text x="20" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#DCDCDC">FoldersDiag - Folder Size Analyzer</text>
  
  <!-- Menu Bar -->
  <rect x="10" y="50" width="1260" height="30" fill="#1E1E1E"/>
  <text x="20" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#DCDCDC">File   View</text>
  
  <!-- Toolbar -->
  <rect x="10" y="80" width="1260" height="50" fill="#2D2D30"/>
  <rect x="20" y="90" width="100" height="30" fill="#3C3C3C" stroke="#555555" stroke-width="1"/>
  <text x="35" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">📁 Browse</text>
  
  <rect x="130" y="90" width="100" height="30" fill="#3C3C3C" stroke="#555555" stroke-width="1"/>
  <text x="140" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">🔄 Refresh</text>
  
  <rect x="250" y="90" width="130" height="30" fill="#3C3C3C" stroke="#555555" stroke-width="1"/>
  <text x="255" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">🌙 Toggle Theme</text>
  
  <!-- ListView Header -->
  <rect x="10" y="130" width="1260" height="30" fill="#2D2D30"/>
  <text x="20" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#DCDCDC">Name</text>
  <text x="420" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#DCDCDC">Size</text>
  <text x="620" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#DCDCDC">Files</text>
  <text x="820" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#DCDCDC">Folders</text>
  <text x="1020" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#DCDCDC">Path</text>
  
  <!-- ListView Content (Sample Data) -->
  <rect x="10" y="160" width="1260" height="30" fill="#1E1E1E"/>
  <text x="20" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">Documents</text>
  <text x="420" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">45.8 GB</text>
  <text x="620" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">8,934</text>
  <text x="820" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">423</text>
  <text x="1020" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">C:\Users\John\Documents</text>
  
  <rect x="10" y="190" width="1260" height="30" fill="#282828"/>
  <text x="30" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">Projects</text>
  <text x="420" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">32.1 GB</text>
  <text x="620" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">6,245</text>
  <text x="820" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">287</text>
  <text x="1020" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">C:\Users\John\...\Projects</text>
  
  <rect x="10" y="220" width="1260" height="30" fill="#1E1E1E"/>
  <text x="50" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">WebApp</text>
  <text x="420" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">15.3 GB</text>
  <text x="620" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">3,102</text>
  <text x="820" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">145</text>
  <text x="1020" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">C:\Users\John\...\WebApp</text>
  
  <rect x="10" y="250" width="1260" height="30" fill="#282828"/>
  <text x="30" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">Downloads</text>
  <text x="420" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">85.2 GB</text>
  <text x="620" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">3,421</text>
  <text x="820" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">156</text>
  <text x="1020" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">C:\Users\John\Downloads</text>
  
  <rect x="10" y="280" width="1260" height="30" fill="#1E1E1E"/>
  <text x="20" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">Videos</text>
  <text x="420" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">125.4 GB</text>
  <text x="620" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">847</text>
  <text x="820" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">12</text>
  <text x="1020" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">C:\Users\John\Videos</text>
  
  <!-- Status Bar -->
  <rect x="10" y="680" width="1260" height="30" fill="#2D2D30"/>
  <text x="20" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DCDCDC">Scan complete. Found 18,473 files in 1,012 folders. Total size: 306.1 GB</text>
  
  <!-- Placeholder Watermark -->
  <text x="640" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="bold" fill="#FF6B6B" opacity="0.3" text-anchor="middle">PLACEHOLDER</text>
  <text x="640" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#888888" text-anchor="middle">Replace with actual screenshot of FoldersDiag in Dark Mode</text>
</svg>
